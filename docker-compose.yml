# Full local stack: database + supporting infra + backend + frontend.
# Each application service builds from its own directory, exactly as Railway
# does with a per-service Root Directory.
name: haven-banking

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: haven
      POSTGRES_PASSWORD: haven_dev_password
      POSTGRES_DB: haven
    ports: ['5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U haven -d haven']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass haven_redis_dev
    ports: ['6379:6379']
    volumes: [redis_data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'haven_redis_dev', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: [minio_data:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  create-bucket:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/haven-private &&
      mc anonymous set none local/haven-private"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://haven:haven_dev_password@postgres:5432/haven?schema=public
      REDIS_URL: redis://:haven_redis_dev@redis:6379
      S3_ENDPOINT: http://minio:9000
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      create-bucket: { condition: service_completed_successfully }
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_URL: http://backend:4000
    ports: ['3000:3000']
    depends_on: [backend]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
